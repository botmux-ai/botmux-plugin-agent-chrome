name: publish

# 只在 main 上打 v* tag 时触发，自动发版到 npm。
# 认证走 npm trusted publishing (OIDC)：npmjs.com 包设置 → Trusted Publishers
# 添加 GitHub 仓库 botmux-ai/botmux-plugin-agent-chrome + workflow publish.yml。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # npm trusted publishing (OIDC)，免长期 token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points to main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} does not point to main"
            exit 1
          fi

      - name: Verify package version matches tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::package.json version '$VERSION' does not match tag '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "releasing ${VERSION}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify install
        run: test -d node_modules/esbuild && test -d node_modules/ws

      - name: Build and test
        run: npm test

      - name: Publish to npm
        # npm trusted publishing：用 OIDC 换发布凭证，不需要 NPM_TOKEN。
        # 前置：npmjs.com 包设置 → Trusted Publishers 添加本仓库 + 本 workflow。
        run: npm publish --access public --provenance
